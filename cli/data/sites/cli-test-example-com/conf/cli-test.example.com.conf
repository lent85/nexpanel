server {
  listen 8080;
  server_name cli-test.example.com ;
  root /home/casper/projects/nexpanel/cli/data/sites/cli-test-example-com/htdocs;
  index index.php index.html;
  client_max_body_size 64m;

  location / {
    try_files $uri $uri/ /index.php?$args;
  }

  location ~ \.php$ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_pass site-cli-test-example-com-php:9000;
  }
}